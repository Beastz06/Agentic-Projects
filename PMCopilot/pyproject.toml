[project]
name = "pmcopilot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.109.2",
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "langchain>=1.3.9",
    "langgraph>=1.2.5",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "mcp>=1.28.0",
    "openai>=2.43.0",
    "pydantic>=2.13.4",
    "pygithub>=2.9.1",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
    "tiktoken>=0.13.0",
]

[dependency-groups]
dev = [
    "grandalf>=0.8",
]
